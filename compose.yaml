# Local development only: HTTP on loopback and locally stored bootstrap keys.
name: chipload-dev

services:
  keycloak-db:
    image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    user: postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Run ./scripts/dev-stack up to generate local credentials}
    volumes:
      - keycloak-data:/var/lib/postgresql/data
    networks: [database]
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U keycloak -d keycloak']
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1@sha256:79c623a22abacf3fe6c00a5fb30f5b7843d717b234033b80995891c06116d244
    command: [start-dev, --import-realm]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Run ./scripts/dev-stack up to generate local credentials}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Run ./scripts/dev-stack up to generate local credentials}
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8080}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - 127.0.0.1:${KEYCLOAK_PORT:-8080}:8080
    volumes:
      - ./deploy/keycloak/chipload-realm.json:/opt/keycloak/data/import/chipload-realm.json:ro
    networks: [control, database]
    depends_on:
      keycloak-db:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3; head -n 1 <&3 | grep -q ' 200 '"
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  openbao:
    image: ghcr.io/openbao/openbao:2.7.1@sha256:6d2b93856e3fcf7b18ad855a0b51eaba474dc8b79cf554379ea32034797d2acf
    command: [server]
    environment:
      BAO_ADDR: http://127.0.0.1:8200
      SKIP_CHOWN: "true"
    ports:
      - 127.0.0.1:${OPENBAO_PORT:-8200}:8200
    volumes:
      - ./deploy/openbao/config.hcl:/openbao/config/chipload.hcl:ro
      - openbao-data:/openbao/file
      - openbao-audit:/openbao/logs
    networks: [control]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    healthcheck:
      # Liveness includes sealed/uninitialized states so the bootstrap can run.
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8200/v1/sys/health?sealedcode=200&uninitcode=200']
      interval: 5s
      timeout: 3s
      retries: 20

networks:
  control: {}
  database:
    internal: true

volumes:
  keycloak-data:
  openbao-data:
  openbao-audit:
