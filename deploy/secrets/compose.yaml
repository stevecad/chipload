name: chipload-secrets
services:
  openbao:
    image: ${CHIPLOAD_OPENBAO_IMAGE:?Run scripts/build-secrets and scripts/secrets-stack}
    pull_policy: never
    command: [server, -config=/etc/openbao/server.hcl]
    user: ${CHIPLOAD_UID:?}:${CHIPLOAD_GID:?}
    environment:
      SKIP_CHOWN: "true"
      SKIP_SETCAP: "true"
    labels:
      org.chipload.secrets-owner: ${CHIPLOAD_SECRETS_OWNER:?}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    cpus: 1
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 64
    ulimits:
      nofile: {soft: 1024, hard: 1024}
      core: {soft: 0, hard: 0}
    tmpfs: ['/tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777']
    logging:
      driver: local
      options: {max-size: 10m, max-file: "3"}
    healthcheck:
      test: [CMD, bao, status, '-address=https://127.0.0.1:8200', '-tls-server-name=${CHIPLOAD_SECRETS_HOST:?}', '-ca-cert=/tls/ca.pem']
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - type: bind
        source: ${CHIPLOAD_SECRETS_STATE:?}/server.hcl
        target: /etc/openbao/server.hcl
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${CHIPLOAD_SECRETS_STATE:?}/certificates
        target: /tls
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${CHIPLOAD_SECRETS_STATE:?}/data
        target: /bao/data
        bind: {create_host_path: false}
      - type: bind
        source: ${CHIPLOAD_SECRETS_STATE:?}/audit
        target: /bao/audit
        bind: {create_host_path: false}
    networks:
      adapter:
        aliases: ['${CHIPLOAD_SECRETS_HOST:?}']
networks:
  adapter:
    external: true
    name: ${CHIPLOAD_ADAPTER_NETWORK:?}
