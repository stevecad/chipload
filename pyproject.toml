[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "chipload"
version = "0.2.0.dev0"
description = "Python definitions and services for software-defined shops"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["pydantic>=2.12,<3"]

[project.optional-dependencies]
server = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "mcp>=2.3,<3",
    "pyjwt[crypto]>=2.15.1,<3",
    "uvicorn>=0.34,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/chipload"]

[dependency-groups]
dev = ["ruff>=0.14,<1"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
